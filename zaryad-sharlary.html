<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Заряд шарлары · психологиялық ахуал</title>
<style>
:root{
  --navy:#0B2A4A; --gold1:#FFE7A0; --gold2:#F2C14E; --gold3:#B8860B;
  --card:#FFFFFF; --shadow:0 12px 30px -12px rgba(5,40,90,.45),0 2px 6px rgba(5,40,90,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#05305E;font-family:"Segoe UI","Noto Sans","Helvetica Neue",Arial,sans-serif;color:var(--navy)}
/* 16:9 сахна: 1920×1080, терезеге сыйғызып масштабталады */
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:1920px;height:1080px;flex:none;overflow:hidden;transform-origin:center center;
  background:radial-gradient(120% 95% at 50% 0%,#BFEAFF 0%,#5CC4FA 30%,#1A98EE 62%,#0866C6 100%)}
.rays{position:absolute;inset:0;pointer-events:none;
  background:repeating-conic-gradient(from 180deg at 50% -8%,rgba(255,255,255,.20) 0deg 2.2deg,rgba(255,255,255,0) 2.2deg 7deg);
  -webkit-mask-image:radial-gradient(75% 75% at 50% 0%,#000 0%,rgba(0,0,0,.55) 45%,transparent 85%);
          mask-image:radial-gradient(75% 75% at 50% 0%,#000 0%,rgba(0,0,0,.55) 45%,transparent 85%);
  animation:raysPulse 9s ease-in-out infinite alternate}
.sun{position:absolute;left:50%;top:-200px;width:620px;height:420px;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,.35) 55%,transparent)}
@keyframes raysPulse{from{opacity:.75}to{opacity:1}}
.corner{position:absolute;width:190px;height:190px;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(80,50,0,.35))}
.corner.tl{left:10px;top:10px}
.corner.tr{right:10px;top:10px;transform:scaleX(-1)}
.corner.bl{left:10px;bottom:10px;transform:scaleY(-1)}
.corner.br{right:10px;bottom:10px;transform:scale(-1,-1)}
.page{position:absolute;inset:0;padding:44px 220px 46px;display:flex;flex-direction:column;align-items:center;gap:26px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.pill{display:inline-block;background:#fff;color:var(--navy);font-weight:800;letter-spacing:3px;font-size:22px;padding:12px 26px;border-radius:999px;box-shadow:var(--shadow)}
.reset{min-height:44px;font:inherit;font-weight:700;font-size:20px;color:var(--navy);background:rgba(255,255,255,.85);
  border:2px solid rgba(255,255,255,.95);border-radius:999px;padding:10px 24px;cursor:pointer;box-shadow:var(--shadow)}
.reset:hover{background:#fff}
.reset:focus-visible,.card:focus-visible{outline:5px solid var(--gold2);outline-offset:4px}
h1{margin:0;color:#fff;font-weight:900;font-size:88px;line-height:1;letter-spacing:.5px;text-align:center;
  text-shadow:0 4px 0 rgba(4,60,130,.35),0 10px 30px rgba(4,50,110,.35)}
.grid{width:100%;flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:1fr 1fr;gap:24px}
.card{position:relative;min-height:44px;padding:20px 18px;border:0;border-radius:28px;background:var(--card);
  box-shadow:var(--shadow);cursor:pointer;overflow:hidden;font:inherit;color:var(--navy);display:flex;align-items:center;justify-content:center;text-align:center;
  -webkit-tap-highlight-color:transparent;transition:transform .15s ease}
.card:not(.open):hover{transform:translateY(-4px)}
.card.open{cursor:default}
.txt{font-size:25px;line-height:1.35;font-weight:700;color:var(--navy);opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .45s ease}
.card.open .txt{opacity:1;transform:none}
.card:not(.open) .txt{visibility:hidden}
/* Шарлар қабаты */
.cover{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,#E9F7FF,#CDEBFF);pointer-events:none}
.bub{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff 0 8%,rgba(255,255,255,.75) 12%,rgba(160,220,255,.55) 38%,rgba(40,150,240,.55) 72%,rgba(20,110,220,.75) 100%);
  box-shadow:0 0 18px rgba(120,200,255,.75),inset -6px -8px 14px rgba(10,90,200,.35),inset 4px 4px 10px rgba(255,255,255,.6);
  animation:float var(--d,4s) ease-in-out var(--dl,0s) infinite alternate;will-change:transform}
.bub::after{content:"";position:absolute;width:26%;height:16%;left:20%;top:16%;border-radius:50%;background:rgba(255,255,255,.95);transform:rotate(-30deg);filter:blur(.5px)}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(var(--fx,4px),var(--fy,-8px))}}
.card.popping .bub{animation:pop .5s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes pop{0%{transform:scale(1);opacity:1}35%{transform:scale(1.25);opacity:1;filter:brightness(1.6)}100%{transform:scale(1.6);opacity:0}}
.card.popping .cover{animation:coverOut .6s ease forwards}
@keyframes coverOut{0%,40%{opacity:1}100%{opacity:0}}
.flash{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.9) 30%,rgba(140,215,255,.6) 60%,transparent 72%);animation:flash .5s ease-out forwards}
@keyframes flash{from{transform:scale(1);opacity:1}to{transform:scale(18);opacity:0}}
.prt{position:absolute;width:var(--s,7px);height:var(--s,7px);border-radius:50%;pointer-events:none;background:var(--c,#BFE6FF);
  box-shadow:0 0 8px var(--c,#BFE6FF);animation:fly var(--t,600ms) cubic-bezier(.15,.7,.3,1) forwards}
@keyframes fly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
/* Төменгі алтын пилюля */
.motto{background:linear-gradient(180deg,var(--gold1),var(--gold2));color:var(--navy);font-weight:900;font-size:38px;
  padding:14px 54px;border-radius:999px;box-shadow:0 4px 0 var(--gold3),var(--shadow);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  .rays,.bub{animation:none}
  .card.popping .bub{animation:fadeQuick .2s linear forwards}
  .card.popping .cover{animation:fadeQuick .2s linear forwards}
  @keyframes fadeQuick{to{opacity:0}}
  .txt{transition:opacity .2s linear}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1BD"/><stop offset=".45" stop-color="#F2C14E"/><stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <symbol id="oyu" viewBox="0 0 200 200">
      <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 196 V40 Q14 14 40 14 H196" stroke-width="9"/>
        <path d="M30 196 V56 Q30 30 56 30 H196" stroke-width="3.5"/>
        <path d="M44 44 C44 82 70 98 92 86 C110 76 104 52 86 54 C74 56 74 72 84 72" stroke-width="7"/>
        <path d="M44 44 C82 44 98 70 86 92 C76 110 52 104 54 86 C56 74 72 74 72 84" stroke-width="7"/>
        <path d="M108 30 C122 50 146 52 158 38 C168 26 154 12 142 22" stroke-width="6"/>
        <path d="M30 108 C50 122 52 146 38 158 C26 168 12 154 22 142" stroke-width="6"/>
        <path d="M150 30 C166 44 184 40 190 26" stroke-width="5"/>
        <path d="M30 150 C44 166 40 184 26 190" stroke-width="5"/>
      </g>
      <path d="M44 34 L54 44 L44 54 L34 44 Z" fill="url(#gold)"/>
      <circle cx="104" cy="104" r="7" fill="url(#gold)"/>
    </symbol>
  </defs>
</svg>
<div class="viewport"><div class="stage" id="stage">
<div class="sun" aria-hidden="true"></div>
<div class="rays" aria-hidden="true"></div>
<svg class="corner tl" aria-hidden="true"><use href="#oyu"/></svg>
<svg class="corner tr" aria-hidden="true"><use href="#oyu"/></svg>
<svg class="corner bl" aria-hidden="true"><use href="#oyu"/></svg>
<svg class="corner br" aria-hidden="true"><use href="#oyu"/></svg>

<main class="page">
  <div class="topbar">
    <span class="pill">2 · ПСИХОЛОГИЯЛЫҚ АХУАЛ · 2 МИН</span>
    <button class="reset" type="button" id="reset">Барлығын жабу</button>
  </div>
  <h1>Заряд шарлары</h1>
  <div class="grid" id="grid"></div>
  <div class="motto">Жауапкершілік – табыстың кілті</div>
  <p class="sr" aria-live="polite" id="live"></p>
</main>
</div></div>

<script>
(function () {
  'use strict';
  var TEXTS = [
    'Заряд жоғалмайды, тек бір денеден екіншісіне өтеді. Сенің еңбегің де ізсіз кетпейді.',
    'Үйкеліс арқылы заряд пайда болады, еңбек арқылы табыс келеді. Бүгін тырыс!',
    'Әр аттас зарядтар тартылады. Әртүрлі пікірлер топты біріктіреді.',
    'Кішкентай ұшқын үлкен от тутатуы мүмкін. Сөзің мен ісіңе жауап бер.',
    'Өткізгіш зарядты өткізеді. Сен де білгеніңді досыңа жеткіз!',
    'Диэлектрик зарядты мықты ұстайды. Сен де назарыңды соңына дейін ұста!',
    'Найзағайдың да заңы бар. Заңды білген адам қорқыпайды, сақтанады.',
    'Жерге қосу — қауіпсіздік, ережені сақтау — жауапкершілік.',
    'Топта әр электрон маңызды. Сенің үлесің де ортақ нәтижеге керек.',
    'Сен — энергия көзісің! Бүгін сыныпты өз зарядыңмен жарықтандыр.',
    'Заряд сақталу заңы — табиғаттың әділдігі. Біз де бір-бірімізге әділ болайық.',
    'Дұрыс жауап — сенің жеңісің, қате — жаңа тәжірибе. Екеуіне де жауап бер.'
  ];
  /* 16:9 сахнаны терезеге сыйғызу */
  var stage = document.getElementById('stage');
  function fit() {
    var k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + k + ')';
  }
  window.addEventListener('resize', fit); fit();
  var grid = document.getElementById('grid');
  var live = document.getElementById('live');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rnd(a, b) { return a + Math.random() * (b - a); }

  /* Карточканың бетін 7–11 шармен толық жабу */
  function makeCover() {
    var cover = document.createElement('span');
    cover.className = 'cover';
    cover.setAttribute('aria-hidden', 'true');
    var n = 7 + Math.floor(Math.random() * 5);
    /* Бетті торға бөліп, әр ұяшыққа бір шар: бос орын қалмайды */
    var cols = n <= 8 ? 4 : 4, rows = Math.ceil(n / cols);
    var cells = [];
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) cells.push([c, r]);
    cells.sort(function () { return Math.random() - 0.5; });
    for (var i = 0; i < n; i++) {
      var cell = cells[i % cells.length];
      var size = rnd(42, 68); /* % — карточка енінен */
      var b = document.createElement('span');
      b.className = 'bub';
      var cx = (cell[0] + 0.5) / cols * 100, cy = (cell[1] + 0.5) / rows * 100;
      b.style.width = size + '%';
      b.style.aspectRatio = '1';
      b.style.left = (cx - size / 2 + rnd(-6, 6)) + '%';
      b.style.top = 'calc(' + (cy + rnd(-8, 8)) + '% - ' + (size / 2) + 'cqw)';
      b.style.setProperty('--d', rnd(2.8, 4.8).toFixed(2) + 's');
      b.style.setProperty('--dl', (-rnd(0, 4)).toFixed(2) + 's');
      b.style.setProperty('--fx', rnd(-6, 6).toFixed(1) + 'px');
      b.style.setProperty('--fy', rnd(-10, -4).toFixed(1) + 'px');
      cover.appendChild(b);
    }
    return cover;
  }

  function burst(card) {
    if (reduce) return;
    var w = card.clientWidth, h = card.clientHeight;
    var fl = document.createElement('span');
    fl.className = 'flash';
    card.appendChild(fl);
    var colors = ['#FFFFFF', '#BFE6FF', '#7FD0FF', '#F2C14E', '#3DA9FC'];
    for (var i = 0; i < 26; i++) {
      var p = document.createElement('span');
      p.className = 'prt';
      var a = rnd(0, Math.PI * 2), d = rnd(0.35, 0.75) * Math.max(w, h);
      p.style.left = (w / 2 + rnd(-w * 0.25, w * 0.25)) + 'px';
      p.style.top = (h / 2 + rnd(-h * 0.25, h * 0.25)) + 'px';
      p.style.setProperty('--x', (Math.cos(a) * d).toFixed(0) + 'px');
      p.style.setProperty('--y', (Math.sin(a) * d).toFixed(0) + 'px');
      p.style.setProperty('--s', rnd(4, 10).toFixed(0) + 'px');
      p.style.setProperty('--t', rnd(450, 700).toFixed(0) + 'ms');
      p.style.setProperty('--c', colors[i % colors.length]);
      card.appendChild(p);
    }
  }

  function openCard(card) {
    if (card.classList.contains('open') || card.classList.contains('popping')) return;
    card.classList.add('popping');
    burst(card);
    var dur = reduce ? 200 : 620;
    setTimeout(function () {
      card.querySelectorAll('.cover,.flash,.prt').forEach(function (el) { el.remove(); });
      card.classList.remove('popping');
      card.classList.add('open');
      card.removeAttribute('aria-label');
      card.setAttribute('aria-disabled', 'true');
      var t = card.querySelector('.txt');
      t.removeAttribute('aria-hidden');
      live.textContent = card.dataset.n + '-карточка: ' + t.textContent;
    }, dur);
  }

  function closeCard(card) {
    card.querySelectorAll('.cover,.flash,.prt').forEach(function (el) { el.remove(); });
    card.classList.remove('open', 'popping');
    card.setAttribute('aria-label', 'Заряд шарын ашу, карточка ' + card.dataset.n);
    card.removeAttribute('aria-disabled');
    card.querySelector('.txt').setAttribute('aria-hidden', 'true');
    card.appendChild(makeCover());
  }

  TEXTS.forEach(function (text, i) {
    var card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card.dataset.n = String(i + 1);
    card.style.containerType = 'inline-size';
    var t = document.createElement('span');
    t.className = 'txt';
    t.textContent = text;
    card.appendChild(t);
    closeCard(card);
    /* button Enter мен Space пернесін өзі «click»-ке айналдырады */
    card.addEventListener('click', function () { openCard(card); });
    grid.appendChild(card);
  });

  document.getElementById('reset').addEventListener('click', function () {
    grid.querySelectorAll('.card').forEach(closeCard);
    live.textContent = 'Барлық карточка қайта жабылды';
  });
})();
</script>
</body>
</html>
